name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: packages
    attributes:
      label: Packages and versions
      placeholder: "@eventualize/core 6.2.0, @eventualize/postgres-storage-adapter 6.2.0"
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [PostgreSQL, MySQL / MariaDB, DynamoDB, Not related]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest code that shows the problem.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: What you expected, and what happened. Paste the full error.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js version and OS
