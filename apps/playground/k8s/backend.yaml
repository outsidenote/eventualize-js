apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-schema
          image: postgres:18
          command:
            ["sh", "-c", "until psql \"$POSTGRES_CONNECTION\" -c 'select 1 from snapshot limit 1'; do sleep 2; done"]
          env:
            - name: POSTGRES_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_CONNECTION
      containers:
        - name: backend
          image: evdb-playground-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: POSTGRES_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_CONNECTION
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 15
